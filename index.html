<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1712">
<title>Ultimate Football 3D</title>
<style>
:root{color-scheme:dark;--panel:rgba(5,13,11,.82);--line:rgba(255,255,255,.68);--blue:#36a9ff;--red:#ff5364}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08130d;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);min-width:230px;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}
#score{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 15px;border:1px solid rgba(255,255,255,.44);border-radius:13px;background:var(--panel);box-shadow:0 5px 24px #0005;font-size:19px;font-weight:900;letter-spacing:.035em;white-space:nowrap}
#blueName{color:var(--blue)}#redName{color:var(--red)}#clock{margin-top:5px;font-size:14px;font-weight:800;letter-spacing:.12em}#message{margin-top:4px;min-height:18px;font-size:13px;font-weight:800}
#help{position:fixed;z-index:4;top:calc(94px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92vw,420px);text-align:center;font-size:11px;color:#fff;opacity:.82;text-shadow:0 2px 5px #000;pointer-events:none}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
#joystick{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));width:142px;height:142px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.45);box-shadow:0 3px 18px #0005;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.88);border:2px solid #fff;box-shadow:0 3px 14px #0009;will-change:transform}
.buttons{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(66px,78px));gap:9px;pointer-events:auto}
button{min-height:58px;padding:8px 5px;border:1px solid rgba(255,255,255,.68);border-radius:15px;background:rgba(5,13,11,.82);color:#fff;font:800 11px/1.15 system-ui,Arial,sans-serif;letter-spacing:.045em;text-align:center;box-shadow:0 3px 12px #0006;touch-action:none;pointer-events:auto}
button:active,button.pressed{background:#1479da;transform:scale(.96)}
#cameraButton,#speedButton{position:absolute;right:max(12px,env(safe-area-inset-right));min-height:42px;padding:8px 11px;font-size:10px}
#cameraButton{top:calc(96px + env(safe-area-inset-top))}#speedButton{top:calc(145px + env(safe-area-inset-top))}
#restartButton{position:absolute;left:50%;bottom:calc(13px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:38px;padding:7px 13px;font-size:10px;opacity:.86}
#endScreen{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);pointer-events:auto}
#endCard{width:min(92vw,380px);padding:26px 22px;border:1px solid #ffffff55;border-radius:22px;background:rgba(8,22,16,.96);text-align:center;box-shadow:0 18px 60px #0009}
#endTitle{margin:0 0 9px;font-size:26px;letter-spacing:.05em}#endScore{margin:0 0 20px;font-size:18px;color:#eaf7ee}#endRestart{width:100%;min-height:52px;background:#167bff;font-size:13px}
@media(max-width:420px){#joystick{width:122px;height:122px;left:max(10px,env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}#stick{width:54px;height:54px;left:32px;top:32px}.buttons{right:max(8px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));grid-template-columns:repeat(2,66px);gap:7px}button{min-height:53px;font-size:10px}#restartButton{bottom:calc(9px + env(safe-area-inset-bottom))}#score{font-size:17px;gap:8px;padding:7px 12px}}
@media(orientation:landscape) and (max-height:500px){#hud{top:calc(6px + env(safe-area-inset-top));left:50%;min-width:200px}#score{padding:5px 10px;font-size:15px}#clock{margin-top:2px;font-size:12px}#message{font-size:11px;margin-top:2px}#help{top:70px}#joystick{width:112px;height:112px;bottom:calc(10px + env(safe-area-inset-bottom))}#stick{left:28px;top:28px;width:52px;height:52px}.buttons{bottom:calc(9px + env(safe-area-inset-bottom));grid-template-columns:repeat(2,66px);gap:6px}button{min-height:45px}#cameraButton{top:calc(70px + env(safe-area-inset-top))}#speedButton{top:calc(115px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<div id="hud" aria-live="polite">
  <div id="score"><span id="blueName">BLUE</span><span id="blueScore">0</span><span>—</span><span id="redScore">0</span><span id="redName">RED</span></div>
  <div id="clock">00:00 · 1×</div>
  <div id="message">ULTIMATE FOOTBALL 3D</div>
</div>
<div id="help">Move with the joystick · WASD / arrow keys also work</div>
<div id="controls">
  <div id="joystick" aria-label="Movement joystick"><div id="stick"></div></div>
  <button id="cameraButton" aria-label="Switch camera">◉ FIELD CAMERA</button>
  <button id="speedButton" aria-label="Change match clock speed">CLOCK 1×</button>
  <div class="buttons">
    <button id="passButton">PASS</button>
    <button id="shootButton">SHOOT ⚽</button>
    <button id="sprintButton">SPRINT</button>
    <button id="switchButton">CHANGE<br>PLAYER</button>
  </div>
  <button id="restartButton">RESTART MATCH</button>
</div>
<div id="endScreen" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div id="endCard"><h1 id="endTitle">FULL TIME</h1><p id="endScore">BLUE 0 — 0 RED</p><button id="endRestart">PLAY AGAIN</button></div>
</div>
<script type="module">

const W = 68, L = 105, GOAL_W = 7.32, GOAL_H = 2.44, BALL_R = 0.32;

circleLine(0.22, 0, -41.5, 0, Math.PI * 2, 24); circleLine(0.22, 0, 41.5, 0, Math.PI * 2, 24);

  for (let row = 0; row < 4; row++) {
    const depth = 4.6, height = 2.4;
    const stand = new THREE.Mesh(new THREE.BoxGeometry(W + 25 + row * 2, height, depth), standMats[row]);
    stand.position.set(0, 2 + row * 1.9, side * (L / 2 + 7 + row * 3)); stand.receiveShadow = true; scene.add(stand);
  }
  for (let row = 0; row < 4; row++) {

  crowdDummy.position.set(x, y, z); crowdDummy.scale.set(sx, sy, sz); crowdDummy.rotation.set(0, ((ci * 17) % 31) / 100, 0); crowdDummy.updateMatrix();

}
for (const side of [-1, 1]) for (let row = 0; row < 3; row++) for (let seat = 0; seat < 40; seat++) addFan(-34 + seat * 1.74, 4.2 + row * 1.9, side * (61 + row * 2.2), 0.75, 1.15, 0.72);
for (const side of [-1, 1]) for (let row = 0; row < 3; row++) for (let seat = 0; seat < 30; seat++) addFan(side * (42 + row * 2.1), 4.2 + row * 1.9, -49 + seat * 3.38, 0.72, 1.15, 0.85);
crowd.count = ci; crowd.instanceMatrix.needsUpdate = true; if (crowd.instanceColor) crowd.instanceColor.needsUpdate = true; scene.add(crowd);

}
const adColors = [0x125a8b, 0x16834b, 0xe4a328, 0xb92f44, 0x4b388c, 0x1594a2];
for (let i = 0; i < 6; i++) { const x = -28 + i * 11.2; makeBoard(10.8, 0.55, x, -54.2, adColors[i]); makeBoard(10.8, 0.55, x, 54.2, adColors[(i + 3) % adColors.length]); }
for (let i = 0; i < 4; i++) { const z = -31 + i * 20.5; makeBoard(0.55, 19.8, -35.1, z, adColors[(i + 2) % adColors.length]); makeBoard(0.55, 19.8, 35.1, z, adColors[(i + 4) % adColors.length]); }
for (const x of [-43, 43]) for (const z of [-52, 52]) {

  lamp.position.set(x, 19.2, z); scene.add(lamp);
}

function makeGoal(z) {
  const group = new THREE.Group();
  const frame = new THREE.MeshStandardMaterial({ color: 0xf5f5f2, roughness: 0.35, metalness: 0.18 });
  const netMat = new THREE.LineBasicMaterial({ color: 0xe7edea, transparent: true, opacity: 0.45 });
  const backZ = z + Math.sign(z) * 2.15;
  function bar(x, y, zz, sx, sy, sz) { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), frame); m.position.set(x, y, zz); m.castShadow = true; group.add(m); }
  bar(-GOAL_W / 2, GOAL_H / 2, z, 0.16, GOAL_H, 0.16); bar(GOAL_W / 2, GOAL_H / 2, z, 0.16, GOAL_H, 0.16); bar(0, GOAL_H, z, GOAL_W + 0.16, 0.16, 0.16);
  bar(-GOAL_W / 2, GOAL_H / 2, backZ, 0.1, GOAL_H, 0.1); bar(GOAL_W / 2, GOAL_H / 2, backZ, 0.1, GOAL_H, 0.1); bar(0, GOAL_H, backZ, GOAL_W, 0.1, 0.1);
  for (let i = 0; i <= 12; i++) { const x = -GOAL_W / 2 + GOAL_W * i / 12; group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0.06, z), new THREE.Vector3(x, GOAL_H, z)]), netMat)); }
  for (let i = 0; i <= 8; i++) { const y = 0.1 + (GOAL_H - 0.2) * i / 8; group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-GOAL_W / 2, y, z), new THREE.Vector3(GOAL_W / 2, y, z)]), netMat)); }
  for (let i = 0; i <= 8; i++) { const zz = z + Math.sign(z) * 2.15 * i / 8; group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-GOAL_W / 2, 0.08, zz), new THREE.Vector3(-GOAL_W / 2, GOAL_H, zz)]), netMat)); group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(GOAL_W / 2, 0.08, zz), new THREE.Vector3(GOAL_W / 2, GOAL_H, zz)]), netMat)); }
  scene.add(group);
}
makeGoal(-L / 2); makeGoal(L / 2);

const commonGeo = {
  torso: new THREE.SphereGeometry(1, 12, 10), head: new THREE.SphereGeometry(0.22, 12, 10), hair: new THREE.SphereGeometry(0.225, 10, 8), neck: new THREE.CylinderGeometry(0.07, 0.08, 0.14, 8),
  shorts: new THREE.BoxGeometry(0.48, 0.22, 0.3), limb: new THREE.CylinderGeometry(0.075, 0.095, 0.42, 7), arm: new THREE.CylinderGeometry(0.065, 0.075, 0.34, 7), sleeve: new THREE.CylinderGeometry(0.09, 0.085, 0.22, 7), boot: new THREE.BoxGeometry(0.16, 0.11, 0.3), eye: new THREE.SphereGeometry(0.025, 6, 5), nose: new THREE.SphereGeometry(0.035, 6, 5), trim: new THREE.BoxGeometry(0.23, 0.045, 0.02), number: new THREE.PlaneGeometry(0.18, 0.22)
};
const skinMat = new THREE.MeshStandardMaterial({ color: 0x9a674b, roughness: 0.86 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x231b17, roughness: 0.95 });
const bootMat = new THREE.MeshStandardMaterial({ color: 0x161a1c, roughness: 0.55, metalness: 0.08 });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x171717 });
const teams = {
  blue: { shirt: new THREE.MeshStandardMaterial({ color: 0x0878ff, roughness: 0.62 }), shorts: new THREE.MeshStandardMaterial({ color: 0xe8edf2, roughness: 0.8 }), sock: new THREE.MeshStandardMaterial({ color: 0x0878ff, roughness: 0.8 }), trim: new THREE.MeshStandardMaterial({ color: 0xf4f8ff, roughness: 0.75 }), keeper: new THREE.MeshStandardMaterial({ color: 0xf2b632, roughness: 0.65 }) },
  red: { shirt: new THREE.MeshStandardMaterial({ color: 0xe53343, roughness: 0.62 }), shorts: new THREE.MeshStandardMaterial({ color: 0x252833, roughness: 0.8 }), sock: new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8 }), trim: new THREE.MeshStandardMaterial({ color: 0xffe8e7, roughness: 0.75 }), keeper: new THREE.MeshStandardMaterial({ color: 0x45c98a, roughness: 0.65 }) }
};
const players = [], blueTeam = [], redTeam = [];

  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 64, 64); ctx.fillStyle = '#15202c'; ctx.font = 'bold 49px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(number), 32, 34);

    if (matchTime >= MATCH_LENGTH) { matchTime = MATCH_LENGTH; updateHud(); finishMatch(); }
    const kx = (pressedKeys.has('d') || pressedKeys.has('arrowright') ? 1 : 0) - (pressedKeys.has('a') || pressedKeys.has('arrowleft') ? 1 : 0);
    const ky = (pressedKeys.has('s') || pressedKeys.has('arrowdown') ? 1 : 0) - (pressedKeys.has('w') || pressedKeys.has('arrowup') ? 1 : 0);
    let ix = input.x + kx, iy = input.y + ky, mag = Math.hypot(ix, iy); if (mag > 1) { ix /= mag; iy /= mag; }
    const moveSpeed = input.sprint || pressedKeys.has('shift') ? 8.1 : 5.3;
    movePlayer(activePlayer, ix, iy, moveSpeed, dt);
    updateAI(dt);
    updateKeeper(redKeeper, -49.4, dt); updateKeeper(blueKeeper, 49.4, dt);
    updatePlayerCollision();
    updateBall(dt);
    if (!possessor && flightLock <= 0 && Math.hypot(ballVelocity.x, ballVelocity.z) < 1.8) {
      const near = closestPlayer([...blueField, ...redField], ball.position);
      if (near && Math.hypot(near.position.x - ball.position.x, near.position.z - ball.position.z) < 1.18) possessor = near;
    }
    updateHud();
  } else {
    for (const player of players) { if (player.userData.animationSpeed > 0.1) movePlayer(player, 0, 0, 0, dt); else animatePlayer(player, dt, 0); }
  }
  if (possessor) { ballMark.position.x = possessor.position.x; ballMark.position.z = possessor.position.z; }
  else { ballMark.position.x = ball.position.x; ballMark.position.z = ball.position.z; }
  ballMark.material.opacity = Math.max(0.08, 0.24 - Math.max(0, ball.position.y - BALL_R) * 0.06);
  updateCamera(dt); renderer.render(scene, camera);
}
startKickoff('blue', false); updateHud(); camera.position.copy(cameraWidePos); camera.lookAt(0, 0, 0); requestAnimationFrame(animate);
</script>
